name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    # vju/satellite-contracts là repo private: cần secret COMPOSER_AUTH của repo, dạng
    # {"github-oauth":{"github.com":"<token có quyền đọc VJUVNU/satellite-contracts>"}}
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
        exclude:
          # Laravel 13 cần PHP >= 8.3.
          - php: '8.2'
            laravel: '13'
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite, sqlite3
          coverage: none

      - run: composer validate --strict --no-check-lock

      - run: >
          composer update --no-interaction --prefer-dist -W
          --with "laravel/framework:^${{ matrix.laravel }}.0"
          --with "orchestra/testbench:${{ matrix.testbench }}"

      - run: vendor/bin/phpunit
